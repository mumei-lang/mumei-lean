name: Authorization model

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  authorization-model:
    name: Authorization model proofs and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ~/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
      - name: Build model, examples, and audit every theorem
        run: python scripts/check_authorization_model.py
      - name: Check fail-closed gate regressions with real Lean
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests/test_authorization_model.py -q
      - name: Preserve build and kernel audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-model
          path: out/authorization-model/
          if-no-files-found: error
