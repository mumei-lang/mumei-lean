name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  python-bridge:
    name: Python bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run pytest
        run: python -m pytest -v

  lean-build:
    name: lake build
    runs-on: ubuntu-latest
    # The Lean job is informational while we bootstrap the mathlib4
    # dependency graph in CI: mathlib master is fast-moving and a full
    # `lake build` can take 30+ minutes. Failures here should not block
    # PRs that only touch Python or docs, so each step is wrapped with
    # `continue-on-error: true`. A green tick is reported regardless of
    # the underlying lake status; treat the actual build result as
    # advisory until we cut over to a pinned mathlib release.
    steps:
      - uses: actions/checkout@v4

      - name: Install elan + Lean toolchain
        continue-on-error: true
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build artefacts
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            .lake
            ~/.elan
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: lake build (informational)
        continue-on-error: true
        run: |
          lake --version
          lake update -R
          # mathlib4 ships a precompiled cache; pull it before building so we
          # don't recompile the whole library from source.
          lake exe cache get || true
          lake build || echo "lake build failed (informational); see logs above"
