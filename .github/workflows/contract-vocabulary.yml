# Cross-repo note (mumei-lang/mumei#1500): the composite action owns only
# the common Python/dependency runner. mumei-lean's path filter and pytest
# selection are repo-specific because this repository owns the Lean bridge
# translator, certificate constants, fixtures, and live theorem-path contract.
name: Contract Vocabulary

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/LEAN_HARNESS_CONTRACT.md'
      - 'docs/ARCHITECTURE.md'
      - '.agents/skills/testing-mumei-lean-live-generated/references/live-generated-theorem-paths.md'
      - 'tests/test_live_path_count_docs.py'
      - 'docs/LEAN_TRANSLATOR_SPEC.md'
      - 'docs/BRIDGE_HARNESS_SPEC.md'
      - 'docs/INTEGRATION.md'
      - 'tests/test_contract_vocabulary.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - 'scripts/export_cert.py'
      - 'scripts/expr_translator.py'
      - 'scripts/bridge.py'
      - 'scripts/ingest_cert.py'
      - 'scripts/bridge_harness.py'
      - 'scripts/sync_contract_constants.py'
      - 'bridge_lemma_catalog.json'
      - 'MumeiLean/CertWriter.lean'
      - 'tests/fixtures/*.json'
      - '.github/workflows/contract-vocabulary.yml'
  push:
    branches: [develop]
    paths:
      - 'README.md'
      - 'docs/LEAN_HARNESS_CONTRACT.md'
      - 'docs/ARCHITECTURE.md'
      - '.agents/skills/testing-mumei-lean-live-generated/references/live-generated-theorem-paths.md'
      - 'tests/test_live_path_count_docs.py'
      - 'docs/LEAN_TRANSLATOR_SPEC.md'
      - 'docs/BRIDGE_HARNESS_SPEC.md'
      - 'docs/INTEGRATION.md'
      - 'tests/test_contract_vocabulary.py'
      - 'tests/test_ci_workflow_timeouts.py'
      - 'scripts/export_cert.py'
      - 'scripts/expr_translator.py'
      - 'scripts/bridge.py'
      - 'scripts/ingest_cert.py'
      - 'scripts/bridge_harness.py'
      - 'scripts/sync_contract_constants.py'
      - 'bridge_lemma_catalog.json'
      - 'MumeiLean/CertWriter.lean'
      - 'tests/fixtures/*.json'
      - '.github/workflows/contract-vocabulary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  contract-vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run contract vocabulary checks
        # Pin the upstream action commit: this check is a security gate, so a
        # mutable branch must not be able to replace it outside this repo's review.
        uses: mumei-lang/mumei/.github/actions/contract-vocabulary@c696632f19cbadb81a9faf6c2cb8b9780e5fa28f
        with:
          python_version: '3.12'
          install_command: python -m pip install pytest pyyaml
          check_command: MUMEI_LEAN_SKIP_LIVE=1 PYTHONPATH=scripts python -m pytest tests/test_contract_vocabulary.py tests/test_ci_workflow_timeouts.py tests/test_live_path_count_docs.py -q
